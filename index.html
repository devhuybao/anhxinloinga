<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Bà Chã Nga ❤️</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="floating-container"></div>
    <button class="music-btn" id="musicBtn" title="Bật/Tắt nhạc">🎵</button>

    <div class="container">
        <div id="quiz">
            <div class="envelope-wrapper" id="envelope">
                <div class="envelope-flap"></div>
                <div class="pocket"></div>
                <div class="click-hint" id="clickHint">✉️ Nhấn để mở thư</div>
                
                <div class="letter">
                    <p class="letter-title">Gửi Bà Chã Nga ❤️</p>
                    <p class="letter-body" id="typewriter"></p>
                </div>
            </div>

            <div id="actionArea" class="action-area">
                <p class="question">Bà Chã Nga hết giận và tha lỗi cho anh nha? 🥺</p>

                <div class="btn-group" id="btnGroup">
                    <button id="btnYes" class="btn">Tha lỗi cho anh ❤️</button>
                    <button id="btnNo" class="btn">Không tha 😜</button>
                </div>
            </div>
        </div>

        <div id="message" class="message">
            <div class="heart-icon">🥰💖</div>
            <h2>Cảm ơn Bà Chã Nga!</h2>
            <p>Biết ngay Bà Chã Nga thương anh nhất mà! Mãi yêu Bà Chã Nga nhìu nhìu ❤️✨</p>
            <p class="timer-note">Trang web sẽ tự đóng sau <span id="countdown">5</span> giây...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
