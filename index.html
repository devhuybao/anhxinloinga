<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Bà Chã ❤️</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <button class="music-btn" id="musicBtn">🎵</button>

    <div class="container">
        <div id="quiz">
            <!-- Bao thư -->
            <div class="envelope-wrapper" id="envelope">
                <div class="envelope-flap"></div>
                <div class="pocket"></div>
                <!-- Bức thư trồi lên -->
                <div class="letter">
                    <p class="letter-title">Gửi Bà Chã ❤️</p>
                    <p class="letter-body" id="typewriter"></p>
                </div>
            </div>

            <!-- Nút bấm & câu hỏi ẩn ban đầu -->
            <div id="questionArea" class="question-area hidden">
                <p class="question">Bà Chã hết giận và tha lỗi cho anh nha? 🥺</p>

                <div class="btn-group" id="btnGroup">
                    <button id="btnYes">Tha lỗi cho anh ❤️</button>
                    <button id="btnNo">Chưa tha đâu 😜</button>
                </div>
            </div>
        </div>

        <div id="message" class="message">
            <div class="heart-icon">🥰</div>
            <h2>Cảm ơn Bà Chã!</h2>
            <p>Biết ngay Bà Chã thương anh nhất mà! Mãi yêu Bà Chã nhìu nhìu ❤️</p>
            <p class="timer-note">Trang web sẽ tự đóng sau <span id="countdown">5</span> giây...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
